[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forgegate"
version = "0.1.0a1"
description = "Evidence-aware release assurance contracts and tooling"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Carlos" }]
dependencies = [
  "cryptography>=46,<51",
  "fastapi>=0.141,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "typer>=0.15,<1",
  "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx2>=2.12,<3",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
forgegate = "forgegate.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["forgegate"]
omit = [
  "src/forgegate/__main__.py",
  # Executed only inside the pinned Podman image; covered by committed live evidence.
  "src/forgegate/plugins/_trusted_runner.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["forgegate"]
