schema_version: forgegate.policy.v1
name: pull-request
# Synthetic teaching thresholds; not a production release policy.
rules:
  - id: tests-pass
    claim: demo.tests-pass
    evidence_kind: test.summary
    aggregation: value
    operator: equals
    expected: 0
    where:
      field: failures
    mandatory: true
    require_presence: true
    on_missing: REVIEW
    minimum_trust: unsigned_local
    minimum_verification: declared
  - id: tests-no-errors
    claim: demo.tests-no-errors
    evidence_kind: test.summary
    aggregation: value
    operator: equals
    expected: 0
    where:
      field: errors
    mandatory: true
    require_presence: true
    on_missing: REVIEW
    minimum_trust: unsigned_local
    minimum_verification: declared
  - id: tests-nonempty
    claim: demo.tests-nonempty
    evidence_kind: test.summary
    aggregation: value
    operator: greater_than
    expected: 0
    where:
      field: total
    mandatory: true
    require_presence: true
    on_missing: REVIEW
    minimum_trust: unsigned_local
    minimum_verification: declared
  - id: coverage-line
    claim: demo.coverage-line
    evidence_kind: coverage.line
    aggregation: value
    operator: greater_than_or_equal
    expected: 80
    where:
      field: percent
      scope: repository
    mandatory: true
    require_presence: true
    on_missing: REVIEW
    minimum_trust: unsigned_local
    minimum_verification: declared
  - id: security-clean
    claim: demo.security-clean
    evidence_kind: static_analysis.summary
    aggregation: value
    operator: equals
    expected: 0
    where:
      field: active
    mandatory: true
    require_presence: true
    on_missing: REVIEW
    minimum_trust: unsigned_local
    minimum_verification: declared
  - id: latency-bound
    claim: demo.latency-bound
    evidence_kind: benchmark.metric
    aggregation: value
    operator: less_than_or_equal
    expected: 50
    where:
      field: value
      metric: latency.p95
      unit: ms
    mandatory: true
    require_presence: true
    on_missing: REVIEW
    minimum_trust: unsigned_local
    minimum_verification: declared
