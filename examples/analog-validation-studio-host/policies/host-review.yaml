schema_version: forgegate.policy.v1
name: host-review
# Consumer-owned review policy; not upstream release authorization.
# Timing/memory bounds match the frozen upstream host quality tool.
rules:
  - id: tests-no-failures
    claim: host.tests-no-failures
    evidence_kind: test.summary
    aggregation: value
    operator: equals
    expected: 0
    where:
      field: failures
    mandatory: true
    require_presence: true
    on_missing: REVIEW
    minimum_trust: unsigned_local
    minimum_verification: declared
  - id: tests-no-errors
    claim: host.tests-no-errors
    evidence_kind: test.summary
    aggregation: value
    operator: equals
    expected: 0
    where:
      field: errors
    mandatory: true
    require_presence: true
    on_missing: REVIEW
    minimum_trust: unsigned_local
    minimum_verification: declared
  - id: tests-nonempty
    claim: host.tests-nonempty
    evidence_kind: test.summary
    aggregation: value
    operator: greater_than
    expected: 0
    where:
      field: total
    mandatory: true
    require_presence: true
    on_missing: REVIEW
    minimum_trust: unsigned_local
    minimum_verification: declared
  - id: line-coverage
    claim: host.line-coverage
    evidence_kind: coverage.line
    aggregation: value
    operator: greater_than_or_equal
    expected: 100
    where:
      field: percent
      scope: repository
    mandatory: true
    require_presence: true
    on_missing: REVIEW
    minimum_trust: unsigned_local
    minimum_verification: declared
  - id: static-review
    claim: host.static-review
    evidence_kind: static_analysis.summary
    aggregation: value
    operator: equals
    expected: 0
    where:
      field: active
    mandatory: true
    require_presence: true
    on_missing: REVIEW
    minimum_trust: unsigned_local
    minimum_verification: declared
  - id: quality-checks
    claim: host.quality-checks
    evidence_kind: benchmark.metric
    aggregation: value
    operator: equals
    expected: 0
    where:
      field: value
      metric: upstream.checks.failed
      unit: count
    mandatory: true
    require_presence: true
    on_missing: REVIEW
    minimum_trust: unsigned_local
    minimum_verification: declared
  - id: replay.10000-time
    claim: host.replay.10000-time
    evidence_kind: benchmark.metric
    aggregation: value
    operator: less_than_or_equal
    expected: 5
    where:
      field: value
      metric: replay.10000.elapsed
      unit: s
    mandatory: true
    require_presence: true
    on_missing: REVIEW
    minimum_trust: unsigned_local
    minimum_verification: declared
  - id: events.10000-time
    claim: host.events.10000-time
    evidence_kind: benchmark.metric
    aggregation: value
    operator: less_than_or_equal
    expected: 5
    where:
      field: value
      metric: events.10000.elapsed
      unit: s
    mandatory: true
    require_presence: true
    on_missing: REVIEW
    minimum_trust: unsigned_local
    minimum_verification: declared
  - id: live.10000-time
    claim: host.live.10000-time
    evidence_kind: benchmark.metric
    aggregation: value
    operator: less_than_or_equal
    expected: 5
    where:
      field: value
      metric: live.10000.elapsed
      unit: s
    mandatory: true
    require_presence: true
    on_missing: REVIEW
    minimum_trust: unsigned_local
    minimum_verification: declared
  - id: demo-time
    claim: host.demo-time
    evidence_kind: benchmark.metric
    aggregation: value
    operator: less_than_or_equal
    expected: 5
    where:
      field: value
      metric: demo.elapsed
      unit: s
    mandatory: true
    require_presence: true
    on_missing: REVIEW
    minimum_trust: unsigned_local
    minimum_verification: declared
  - id: replay-memory
    claim: host.replay-memory
    evidence_kind: benchmark.metric
    aggregation: value
    operator: less_than_or_equal
    expected: 128
    where:
      field: value
      metric: replay.10000.peak_memory
      unit: MiB
    mandatory: true
    require_presence: true
    on_missing: REVIEW
    minimum_trust: unsigned_local
    minimum_verification: declared
  - id: live-memory
    claim: host.live-memory
    evidence_kind: benchmark.metric
    aggregation: value
    operator: less_than_or_equal
    expected: 64
    where:
      field: value
      metric: live.10000.peak_memory
      unit: MiB
    mandatory: true
    require_presence: true
    on_missing: REVIEW
    minimum_trust: unsigned_local
    minimum_verification: declared
