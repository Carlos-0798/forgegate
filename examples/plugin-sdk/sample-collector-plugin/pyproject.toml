[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forgegate-sample-collector-plugin"
version = "0.2.0"
description = "Generic isolated collector fixture for ForgeGate plugin discovery and execution"
readme = "README.md"
requires-python = ">=3.12"

[project.entry-points."forgegate.plugins.v1"]
"example.forgegate-sample-collector" = "forgegate_sample_collector.runtime:plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forgegate_sample_collector = ["forgegate-plugin.json"]
