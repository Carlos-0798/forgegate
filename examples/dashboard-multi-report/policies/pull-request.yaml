# Synthetic browser acceptance only. Not a production coverage threshold.
schema_version: forgegate.policy.v1
name: pull-request
rules:
  - id: tests-pass
    claim: tests.no-failures
    evidence_kind: test.summary
    aggregation: value
    operator: equals
    expected: 0
    where:
      field: failures
    mandatory: true
    require_presence: true
    on_missing: REVIEW
    minimum_trust: unsigned_local
    minimum_verification: declared
  - id: tests-no-errors
    claim: tests.no-errors
    evidence_kind: test.summary
    aggregation: value
    operator: equals
    expected: 0
    where:
      field: errors
    mandatory: true
    require_presence: true
    on_missing: REVIEW
    minimum_trust: unsigned_local
    minimum_verification: declared
  - id: tests-nonempty
    claim: tests.nonempty
    evidence_kind: test.summary
    aggregation: value
    operator: greater_than
    expected: 0
    where:
      field: total
    mandatory: true
    require_presence: true
    on_missing: REVIEW
    minimum_trust: unsigned_local
    minimum_verification: declared
  - id: coverage-line
    claim: coverage.minimum
    evidence_kind: coverage.line
    aggregation: value
    operator: greater_than_or_equal
    expected: 50
    where:
      field: percent
      scope: repository
    mandatory: true
    require_presence: true
    on_missing: REVIEW
    minimum_trust: unsigned_local
    minimum_verification: declared
